
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nexora</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
margin:0;
background:#05080e;
color:#fff;
font-family:Arial,sans-serif;
}

button{
font-family:inherit;
}

.app{
max-width:520px;
margin:auto;
min-height:100vh;
padding:14px;
padding-bottom:25px;
background:
radial-gradient(circle at 50% 40%,rgba(255,190,0,.13),transparent 32%),
linear-gradient(#0a0e16,#05080e);
}

/* TOP */

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
}

.profile{
display:flex;
align-items:center;
gap:10px;
cursor:pointer;
}

.avatar{
width:56px;
height:56px;
border-radius:17px;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
background:linear-gradient(145deg,#29364a,#101722);
border:1px solid #39475b;
}

.username{
font-size:18px;
font-weight:800;
}

.level{
margin-top:6px;
font-size:13px;
color:#ffd02a;
}

.reward{
min-width:145px;
padding:10px;
border-radius:17px;
display:flex;
gap:8px;
align-items:center;
background:linear-gradient(145deg,#182130,#0e141d);
border:1px solid #354153;
cursor:pointer;
}

.reward-icon{font-size:24px}
.reward-title{font-size:12px;font-weight:bold}
.reward-time{font-size:11px;color:#9da7b7;margin-top:4px}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:14px;
}

.stat{
padding:11px 4px;
text-align:center;
border-radius:16px;
background:linear-gradient(145deg,#17202d,#0d131d);
border:1px solid #344052;
}

.stat-label{
font-size:10px;
color:#929cac;
font-weight:bold;
}

.stat-value{
margin-top:7px;
font-size:16px;
font-weight:900;
}

/* BALANCE */

.balance{
text-align:center;
margin-top:17px;
}

.balance-number{
font-size:43px;
font-weight:900;
}

.balance-title{
color:#9ba4b2;
font-size:15px;
letter-spacing:1px;
margin-top:5px;
}

/* COIN */

.coin-area{
height:305px;
display:flex;
align-items:center;
justify-content:center;
}

.coin{
width:245px;
height:245px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:radial-gradient(circle at 35% 25%,#fff19a,#ffd12a 25%,#f2a500 55%,#a75a00 78%,#633500);
border:8px solid #ffda42;
box-shadow:
0 0 15px #ffbf00,
0 0 35px rgba(255,188,0,.55),
0 0 80px rgba(255,170,0,.22);
cursor:pointer;
user-select:none;
transition:transform .08s;
}

.coin:active{
transform:scale(.93);
}

.coin-inner{
width:175px;
height:175px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:radial-gradient(circle,#202631,#0b0e14);
border:5px solid #6c3b00;
}

.coin-letter{
font-size:105px;
font-weight:1000;
color:#ffd21a;
text-shadow:2px 3px 0 #8a5100,0 0 15px #ffb700;
}

/* ENERGY */

.energy{
padding:13px 16px;
border-radius:18px;
background:linear-gradient(145deg,#17202d,#0d131c);
border:1px solid #344052;
}

.energy-row{
display:flex;
justify-content:space-between;
font-size:14px;
}

.energy-bar{
height:11px;
margin-top:9px;
background:#29313e;
border-radius:20px;
overflow:hidden;
}

.energy-fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#ffb900,#ffe15b);
}

/* MENU */

.menu{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-top:12px;
}

.menu-button{
min-height:96px;
border-radius:17px;
background:linear-gradient(145deg,#17202d,#0c121b);
border:1px solid #344052;
color:#fff;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
cursor:pointer;
}

.menu-button:active{
transform:scale(.95);
}

.menu-icon{
font-size:30px;
margin-bottom:7px;
}

.menu-text{
font-size:12px;
font-weight:bold;
}

/* BOTTOM */

.bottom{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:10px;
}

.bottom-button{
padding:14px 5px;
text-align:center;
border-radius:16px;
background:linear-gradient(145deg,#17202d,#0c121b);
border:1px solid #344052;
font-size:13px;
cursor:pointer;
}

/* POPUP */

.popup{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
padding:20px;
background:rgba(0,0,0,.8);
z-index:100;
}

.popup-box{
width:100%;
max-width:390px;
max-height:90vh;
overflow:auto;
padding:22px;
border-radius:23px;
background:linear-gradient(145deg,#182130,#0c121b);
border:1px solid #3a4658;
}

.popup-title{
margin:0 0 15px;
font-size:22px;
}

.close{
width:100%;
margin-top:15px;
padding:13px;
border:0;
border-radius:14px;
background:#293548;
color:white;
font-size:15px;
}

.action{
width:100%;
padding:13px;
border:0;
border-radius:13px;
background:#f5b900;
color:#111;
font-weight:bold;
margin-top:10px;
}

.input{
width:100%;
padding:13px;
border-radius:13px;
border:1px solid #3c4759;
background:#0d131c;
color:white;
font-size:16px;
outline:none;
}

.avatar-list{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-top:12px;
}

.avatar-choice{
height:58px;
border-radius:14px;
border:1px solid #354153;
background:#121a26;
font-size:28px;
cursor:pointer;
}

.avatar-choice.selected{
border:2px solid #ffd029;
background:#272515;
}

.referral{
background:#0c131d;
border:1px solid #344052;
border-radius:14px;
padding:13px;
margin:10px 0;
word-break:break-all;
color:#dfe5ef;
}

.mission{
padding:13px;
border-radius:14px;
background:#101824;
border:1px solid #303c4e;
margin-bottom:9px;
}

.mission-title{
font-weight:bold;
}

.mission-progress{
font-size:12px;
color:#a5afbf;
margin-top:6px;
}

.mission-reward{
color:#ffd02a;
margin-top:7px;
}

.tap-number{
position:fixed;
pointer-events:none;
color:#ffd72a;
font-size:27px;
font-weight:900;
z-index:1000;
animation:up .75s ease-out forwards;
}

@keyframes up{
to{
transform:translateY(-95px) scale(1.2);
opacity:0;
}
}

@media(max-width:390px){

.reward{
min-width:130px;
}

.coin{
width:220px;
height:220px;
}

.coin-inner{
width:158px;
height:158px;
}

.coin-letter{
font-size:92px;
}

.coin-area{
height:280px;
}

.menu-button{
min-height:88px;
}

.menu-icon{
font-size:27px;
}
}
</style>
</head>

<body>

<div class="app">

<div class="top">

<div class="profile" onclick="openProfile()">

<div class="avatar" id="avatar">
🙂
</div>

<div>

<div class="username" id="username">
Player
</div>

<div class="level">
⭐ Level <span id="level">1</span>
</div>

</div>

</div>

<div class="reward" onclick="dailyReward()">

<div class="reward-icon">🎁</div>

<div>
<div class="reward-title">Daily Reward</div>
<div class="reward-time" id="rewardText">Claim →</div>
</div>

</div>

</div>


<div class="stats">

<div class="stat">
<div class="stat-label">PROFIT PER TAP</div>
<div class="stat-value">🪙 +<span id="perTap">1</span></div>
</div>

<div class="stat">
<div class="stat-label">TO LEVEL UP</div>
<div class="stat-value" id="levelCost">1K</div>
</div>

<div class="stat">
<div class="stat-label">PROFIT PER HOUR</div>
<div class="stat-value">🪙 <span id="perHour">0</span></div>
</div>

</div>


<div class="balance">

<div class="balance-number" id="balance">
0
</div>

<div class="balance-title">
NEXORA COIN
</div>

</div>


<div class="coin-area">

<div class="coin" id="coin">

<div class="coin-inner">

<div class="coin-letter">
N
</div>

</div>

</div>

</div>


<div class="energy">

<div class="energy-row">

<div>⚡ Energy</div>

<div>
<span id="energy">1000</span> / 1000
</div>

</div>

<div class="energy-bar">

<div class="energy-fill"
id="energyFill">
</div>

</div>

</div>


<div class="menu">

<button class="menu-button" onclick="openUpgrade()">
<span class="menu-icon">🚀</span>
<span class="menu-text">Upgrade</span>
</button>

<button class="menu-button" onclick="openMissions()">
<span class="menu-icon">📋</span>
<span class="menu-text">Missions</span>
</button>

<button class="menu-button" onclick="openFriends()">
<span class="menu-icon">👥</span>
<span class="menu-text">Friends</span>
</button>

<button class="menu-button" onclick="openWallet()">
<span class="menu-icon">💼</span>
<span class="menu-text">Wallet</span>
</button>

</div>


<div class="bottom">

<div class="bottom-button"
onclick="openLeaderboard()">
🏆 Leaderboard
</div>

<div class="bottom-button"
onclick="openStatistics()">
📊 Statistics
</div>

</div>

</div>


<!-- POPUP -->

<div class="popup" id="popup">

<div class="popup-box">

<h2 class="popup-title" id="popupTitle"></h2>

<div id="popupContent"></div>

<button class="close"
onclick="closePopup()">
Close
</button>

</div>

</div>


<script>

/* TELEGRAM */

const tg =
window.Telegram &&
window.Telegram.WebApp;

if(tg){
tg.ready();
tg.expand();
}


/* PLAYER DATA */

let state =
JSON.parse(
localStorage.getItem("nexora_state")
||
JSON.stringify({

name:"",
avatar:"🙂",

balance:0,

energy:1000,

level:1,

perTap:1,

taps:0,

dailyReward:0,

missions:{

tap100:false,
tap500:false,
daily:false

}

})
);


/* ELEMENTS */

const $ =
id => document.getElementById(id);


/* SAVE */

function save(){

localStorage.setItem(
"nexora_state",
JSON.stringify(state)
);

render();

}


/* RENDER */

function render(){

$("balance").textContent =
Math.floor(state.balance).toLocaleString();

$("energy").textContent =
Math.floor(state.energy);

$("level").textContent =
state.level;

$("perTap").textContent =
state.perTap;

$("username").textContent =
state.name || "Player";

$("avatar").textContent =
state.avatar;

$("energyFill").style.width =
(state.energy/1000*100)+"%";

let cost =
state.level * 1000;

$("levelCost").textContent =
cost >= 1000
? (cost/1000)+"K"
: cost;

if(
state.dailyReward &&
Date.now()-state.dailyReward
<86400000
){

$("rewardText").textContent =
"Claimed ✓";

}else{

$("rewardText").textContent =
"Claim →";

}

}


/* PROFILE */

function openProfile(){

let avatars=[
"🙂","😎","🤖",
"👽","🦊","🐯",
"🐼","🦁","🐸",
"🥷","👑","🚀"
];

let html=`

<h2 class="popup-title">
👤 Your Nexora Profile
</h2>

<input
class="input"
id="nameInput"
maxlength="20"
placeholder="Enter your name"
value="${escapeHtml(state.name)}"
>

<div style="margin-top:14px;font-weight:bold">
Choose Avatar
</div>

<div class="avatar-list">
`;

avatars.forEach(a=>{

html+=`

<button
class="avatar-choice ${
state.avatar===a
?"selected":""
}"
onclick="chooseAvatar('${a}',this)">
${a}
</button>

`;

});

html+=`

</div>

<button
class="action"
onclick="saveProfile()">
Save Profile
</button>
`;

openPopup(
"Profile",
html,
false
);

}


/* SAFE TEXT */

function escapeHtml(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* AVATAR */

let selectedAvatar=null;

function chooseAvatar(a,button){

selectedAvatar=a;

document
.querySelectorAll(".avatar-choice")
.forEach(x=>
x.classList.remove("selected")
);

button.classList.add("selected");

}


/* SAVE PROFILE */

function saveProfile(){

let name =
$("nameInput").value.trim();

if(!name){

name="Player";

}

state.name=name;

if(selectedAvatar){

state.avatar=
selectedAvatar;

}

save();

closePopup();

}


/* DAILY REWARD */

function dailyReward(){

if(
state.dailyReward &&
Date.now()-state.dailyReward
<86400000
){

openPopup(
"🎁 Daily Reward",
"<p>You already claimed today's reward.</p><p>Come back tomorrow!</p>"
);

return;

}

state.balance+=100;

state.dailyReward=
Date.now();

state.missions.daily=true;

save();

openPopup(
"🎁 Daily Reward",
"<p>Congratulations!</p><p><b>+100 NEX</b> added to your balance.</p>"
);

}


/* TAP */

$("coin")
.addEventListener(
"pointerdown",
function(e){

if(state.energy<=0)
return;

state.balance+=
state.perTap;

state.energy--;

state.taps++;

if(
state.taps>=100 &&
!state.missions.tap100
){

state.balance+=100;

state.missions.tap100=true;

}

if(
state.taps>=500 &&
!state.missions.tap500
){

state.balance+=500;

state.missions.tap500=true;

}

let pop =
document.createElement("div");

pop.className=
"tap-number";

pop.textContent=
"+"+state.perTap+" NEX";

pop.style.left=
(e.clientX-10)+"px";

pop.style.top=
(e.clientY-20)+"px";

document.body.appendChild(pop);

setTimeout(
()=>pop.remove(),
750
);

save();

}
);


/* ENERGY */

setInterval(
function(){

if(state.energy<1000){

state.energy=
Math.min(
1000,
state.energy+1
);

save();

}

},
1000
);


/* UPGRADE */

function openUpgrade(){

let cost =
state.level*1000;

let html=`

<p>
Current Tap Power:
<b>+${state.perTap} NEX</b>
</p>

<p>
Next level:
<b>+${state.perTap+1} NEX</b>
</p>

<p>
Upgrade cost:
<b>${cost.toLocaleString()} NEX</b>
</p>

<button
class="action"
onclick="upgrade()">
🚀 Upgrade
</button>
`;

openPopup(
"🚀 Upgrade",
html
);

}


function upgrade(){

let cost=
state.level*1000;

if(state.balance<cost){

openPopup(
"Not enough NEX",
"<p>You need <b>"+
cost.toLocaleString()+
" NEX</b> to upgrade.</p>"
);

return;

}

state.balance-=cost;

state.level++;

state.perTap++;

save();

openUpgrade();

}


/* MISSIONS */

function openMissions(){

let html=`

<div class="mission">

<div class="mission-title">
🪙 Tap 100 times
</div>

<div class="mission-progress">
Progress:
${Math.min(state.taps,100)} / 100
</div>

<div class="mission-reward">
Reward: +100 NEX
</div>

</div>


<div class="mission">

<div class="mission-title">
🔥 Tap 500 times
</div>

<div class="mission-progress">
Progress:
${Math.min(state.taps,500)} / 500
</div>

<div class="mission-reward">
Reward: +500 NEX
</div>

</div>


<div class="mission">

<div class="mission-title">
🎁 Claim Daily Reward
</div>

<div class="mission-progress">
${
state.missions.daily
?"Completed ✓"
:"Not completed"
}
</div>

<div class="mission-reward">
Reward: Daily bonus
</div>

</div>

`;

openPopup(
"📋 Missions",
html
);

}


/* FRIENDS */

function openFriends(){

let code =
"NX"+generateCode();

let link =
"https://t.me/NexoraTapBot?start="+code;

let html=`

<p>
Invite friends and earn referral rewards.
</p>

<div class="referral">

<b>Your referral code</b>

<br><br>

${code}

</div>

<div class="referral">

<b>Your referral link</b>

<br><br>

${link}

</div>

<button
class="action"
onclick="copyReferral('${link}')">
📋 Copy Referral Link
</button>

<p style="color:#9da7b7;font-size:12px">
The referral system needs a backend to securely track real invited Telegram users.
</p>

`;

openPopup(
"👥 Friends",
html
);

}


function generateCode(){

let id =
localStorage.getItem(
"nexora_ref"
);

if(!id){

id=
Math.random()
.toString(36)
.substring(2,9)
.toUpperCase();

localStorage.setItem(
"nexora_ref",
id
);

}

return id;

}


function copyReferral(link){

navigator.clipboard
?.writeText(link);

openPopup(
"✅ Copied",
"<p>Your referral link has been copied.</p>"
);

}


/* WALLET */

function openWallet(){

let html=`

<div style="text-align:center">

<div style="font-size:50px">
💼
</div>

<h3>NEXORA Wallet</h3>

<div class="referral">
Balance<br><br>
<b style="font-size:24px">
${Math.floor(state.balance).toLocaleString()}
NEX
</b>
</div>

<p style="color:#9da7b7">
Your NEX balance is currently an
in-game balance. Blockchain wallet
integration can be added later.
</p>

</div>

`;

openPopup(
"💼 Wallet",
html
);


/* LEADERBOARD */

}

function openLeaderboard(){

let html = `

<div class="mission" style="text-align:center">

<div style="font-size:40px">
🏆
</div>

<h3>Global Leaderboard</h3>

<p style="color:#9da7b7">
The global leaderboard is not connected yet.
</p>

<p style="color:#9da7b7;font-size:13px">
Your ranking will appear here when the
Nexora server is connected.
</p>

</div>

`;

openPopup(
"🏆 Leaderboard",
html
);


/* STATISTICS */

}

function openStatistics(){

let html=`

<div class="mission">
🪙 Total NEX
<b style="float:right">
${Math.floor(state.balance).toLocaleString()}
</b>
</div>

<div class="mission">
👆 Total Taps
<b style="float:right">
${state.taps.toLocaleString()}
</b>
</div>

<div class="mission">
⭐ Level
<b style="float:right">
${state.level}
</b>
</div>

<div class="mission">
⚡ Tap Power
<b style="float:right">
+${state.perTap}
</b>
</div>

`;

openPopup(
"📊 Statistics",
html
);


/* POPUP */

}

function openPopup(
title,
content,
showClose=true
){

$("popupTitle").textContent=
title;

$("popupContent").innerHTML=
content;

$("popup").style.display=
"flex";

}


function closePopup(){

$("popup").style.display=
"none";

}


/* TELEGRAM NAME */

if(
tg &&
tg.initDataUnsafe &&
tg.initDataUnsafe.user &&
!state.name
){

state.name=
tg.initDataUnsafe.user.first_name ||
"Player";

save();

}


/* START */

render();

</script>

</body>
    </html>
